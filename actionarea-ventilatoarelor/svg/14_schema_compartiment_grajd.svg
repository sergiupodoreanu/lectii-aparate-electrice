='H1 alarmă' inkscape:label='H1 alarmă'><circle cx='200' cy='340' r='12' stroke='#b3261e' stroke-width='1.6' fill='none' stroke-linecap='round'/><text x='200' y='340' text-anchor='middle' font-size='12' font-weight='bold' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>!</text><text x='200' y='362' text-anchor='middle' font-size='8' font-weight='normal' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>alarmă → telefon</text></g><g id='G1 grup electrogen' inkscape:label='G1 grup electrogen'><rect x='60' y='440' width='110' height='50' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='115' y='458' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>G1 grup electrogen</text><text x='115' y='474' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>+ comutator rețea/grup</text></g><g id='Q0 tablou' inkscape:label='Q0 tablou'><rect x='200' y='440' width='70' height='50' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='235' y='465' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>tablou</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'><text x='300' y='450' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Reguli (TierSchNutztV § 3, DLG-Merkblatt 422): dispozitiv de rezervă care asigură aer la pană (clapete cu arc)</text><text x='300' y='464' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>+ alarmă la că