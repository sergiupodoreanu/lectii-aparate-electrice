 260 180Z' stroke='#111' stroke-width='1.6' fill='#111' stroke-linecap='round' stroke-linejoin='round'/><text x='260' y='235' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>ventilator refulare</text></g><g id='M1' inkscape:label='M1'><circle cx='260' cy='120' r='14' stroke='#111' stroke-width='1.6' fill='#fff' stroke-linecap='round' stroke-linejoin='round'/><text x='260' y='116' text-anchor='middle' font-size='13' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>M</text><text x='260' y='129' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~</text><path d='M260 134L260 154' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/></g><g id='Cutie VAV 1' inkscape:label='Cutie VAV 1'><rect x='540' y='195' width='40' height='30' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M548 200L572 220' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='560' cy='210' r='3' fill='#111'/><text x='560' y='240' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>VAV 1</text><text x='560' y='252' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>clapetă de zonă</text><path d='M560 225L560 260' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='560' y='270' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>→ încăpere</text></g><g id='Cutie VAV 2' inkscape:label='Cutie VAV 2'><rect x='660' y='195' width='40' height='30' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M668 200L692 220' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='680' cy='210' r='3' fill='#111'/><text x='680' y='240' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>VAV 2</text><text x='680' y='252' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>clapetă de zonă</text><path d='M680 225L680 260' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='680' y='270' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>→ încăpere</text></g><g id='Cutie VAV 3' inkscape:label='Cutie VAV 3'><rect x='780' y='195' width='40' height='30' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M788 200L812 220' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='800' cy='210' r='3' fill='#111'/><text x='800' y='240' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>VAV 3</text><text x='800' y='252' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>clapetă de zonă</text><path d='M800 225L800 260' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='800' y='270' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>→ încăpere</text></g><g id='B1 traductor presiune statică' inkscape:label='B1 traductor presiune statică'><circle cx='460' cy='120' r='11' stroke='#111' stroke-width='1.6' fill='#fff' stroke-linecap='round' stroke-linejoin='round'/><text x='460' y='120' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Δp</text><path d='M460 131L460 165' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='460' y='100' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>B1: presiune statică în canal</text><text x='460' y='88' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>(la ≈ 2/3 din lungimea canalului)</text></g><g id='U1 convertizor' inkscape:label='U1 convertizor'><rect x='310.0' y='40' width='60' height='50' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M310.0 90L370.0 40' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='327.0' y='54.5' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>~</text><text x='353.0' y='75.5' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>~</text><text x='353.0' y='87.5' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f var.</text><text x='370' y='30' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>U1 cu PID intern</text></g><g id='Referință' inkscape:label='Referință'><rect x='230' y='40' width='80' height='40' rx='0' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='270' y='52' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>referință</text><text x='270' y='66' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>300 Pa</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'><text x='660' y='130' text-anchor='start' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Funcționare:</text><text x='660' y='146' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>clapetele VAV se închid → Δp crește → PID scade turația</text><text x='660' y='158' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>clapetele se deschid → Δp scade → PID crește turația</text><text x='660' y='170' text-anchor='start' font-size='8' font-weight='normal' fill='#2e7d32' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>p = ct. → Q după nevoie → P ~ n³</text><text x='40' y='320' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Regulă practică: referința se alege ca presiunea minimă la care ultima cutie VAV, complet deschisă, primește debitul de calcul</text><text x='40' y='336' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>(„resetul presiunii” în BMS coboară referința când toate clapetele sunt parțial închise). Frecvența minimă: 15–20 Hz, ca motorul să se răcească.</text></g></svg>