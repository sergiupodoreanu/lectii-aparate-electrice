oke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='110' text-anchor='middle' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>redresor</text><text x='220' y='126' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>6 diode (B6)</text><path d='M200 150L240 150M225 140L240 150L225 160Z' stroke='#111' stroke-width='1.6' fill='#111' stroke-linecap='round' stroke-linejoin='round'/><path d='M240 140L240 160' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='190' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>c.a. → c.c.</text></g><g id='Circuit intermediar de c.c.' inkscape:label='Circuit intermediar de c.c.'><rect x='380' y='90' width='110' height='120' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='435' y='110' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>circuit intermediar</text><path d='M435 125L435 145M420 145L450 145M420 155L450 155M435 155L435 175' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='435' y='190' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>≈ 565 V c.c.</text><text x='435' y='226' text-anchor='middle' font-size='8' font-weight='normal' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>condensatoare: rămân încărcate</text><text x='435' y='238' text-anchor='middle' font-size='8' font-weight='normal' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>minute după oprire!</text></g><g id='Invertor' inkscape:label='Invertor'><rect x='590' y='90' width='130' height='120' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='655' y='110' text-anchor='middle' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>invertor</text><text x='655' y='126' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>6 tranzistoare IGBT</text><path d='M615 150L640 150M640 140L640 160M640 140L660 150L640 160' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M660 150L690 150' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='655' y='190' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>c.c. → c.a. cu f și U variabile</text></g><g id='M1 motor' inkscape:label='M1 motor'><circle cx='815' cy='150' r='22' stroke='#111' stroke-width='1.6' fill='#fff' stroke-linecap='round' stroke-linejoin='round'/><text x='815' y='146' text-anchor='middle' font-size='13' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>M</text><text x='815' y='159' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~</text><text x='815' y='190' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f = 0…50 Hz</text><text x='815' y='204' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>U = 0…400 V</text></g><g id='Comanda' inkscape:label='Comanda'><rect x='380' y='260' width='340' height='60' rx='0' stroke='#1d5fa8' stroke-width='1.6' fill='none' stroke-linecap='round'/><text x='550' y='280' text-anchor='middle' font-size='10' font-weight='bold' fill='#1d5fa8' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>partea de comandă (microprocesor)</text><text x='550' y='298' text-anchor='middle' font-size='8' font-weight='normal' fill='#1d5fa8' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>referință 0–10 V / tastatură / Modbus → calculează f și U → comandă tranzistoarele (PWM)</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'><text x='60' y='150' text-anchor='middle' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>rețea</text><text x='60' y='166' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~ 400 V</text><text x='60' y='180' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>50 Hz</text><text x='753' y='30' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>la ieșire: impulsuri PWM; media lor = sinusoidă</text><path d='M700 80L706 80L706 60L712 60L712 80L720 80L720 50L732 50L732 80L744 80L744 44L760 44L760 80L770 80L770 50L782 50L782 80L792 80L792 60L798 60L798 80L806 80' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M700 80Q753 10 806 80' stroke='#2e7d32' stroke-width='1.6' fill='none' stroke-linecap='round'/></g></svg>