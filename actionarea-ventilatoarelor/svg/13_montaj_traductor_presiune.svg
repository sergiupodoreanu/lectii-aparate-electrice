<svg xmlns='http://www.w3.org/2000/svg' xmlns:inkscape='http://www.inkscape.org/namespaces/inkscape' xmlns:sodipodi='http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd' width='900' height='300' viewBox='0 0 900 300'><title>Montajul traductorului de presiune în canal</title><rect width='900' height='300' fill='#fff'/><g inkscape:groupmode='layer' inkscape:label='Conductoare' id='layer_Conductoare'><path d='M40 120L860 120M40 180L860 180' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M560 120L560 106' stroke='#1d5fa8' stroke-width='1.6' fill='none' stroke-linecap='round'/><path d='M562.6 111.4L560 106L557.4 111.4' stroke='#1d5fa8' stroke-width='1.6' fill='none' stroke-linecap='round'/></g><g inkscape:groupmode='layer' inkscape:label='Aparate' id='layer_Aparate'><g id='Ventilator' inkscape:label='Ventilator'><circle cx='90' cy='150' r='24' stroke='#111' stroke-width='1.6' fill='#fff' stroke-linecap='round' stroke-linejoin='round'/><path d='M90 150Q68.4 128.4 78.0 148.8Q85.2 157.2 90 150Z' stroke='#111' stroke-width='1.6' fill='#111' stroke-linecap='round' stroke-linejoin='round'/><path d='M90 150Q111.6 171.6 102.0 151.2Q94.8 142.8 90 150Z' stroke='#111' stroke-width='1.6' fill='#111' stroke-linecap='round' stroke-linejoin='round'/><text x='90' y='200' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>ventilator</text></g><g id='Cot' inkscape:label='Cot'><path d='M180 120L220 120M180 180L220 180' stroke='#b3261e' stroke-width='1.6' fill='none' stroke-linecap='round'/><text x='200' y='200' text-anchor='middle' font-size='8' font-weight='normal' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>cot / tranziție</text><text x='200' y='212' text-anchor='middle' font-size='8' font-weight='normal' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>(zonă turbulentă)</text></g><g id='B1 traductor Δp' inkscape:label='B1 traductor Δp'><rect x='540' y='60' width='70' height='36' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='575' y='72' text-anchor='middle' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>B1 Δp</text><text x='575' y='88' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>4–20 mA</text><path d='M560 96L560 120' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M590 96L590 106L640 106L640 50L860 50' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='750' y='40' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>priza „–”: presiune atmosferică / încăpere</text><text x='560' y='110' text-anchor='end' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>+</text></g><g id='Zonă montaj' inkscape:label='Zonă montaj'><path d='M300 100L300 200' stroke='#111' stroke-width='1.2' fill='none' stroke-dasharray='5 4'/><path d='M840 100L840 200' stroke='#111' stroke-width='1.2' fill='none' stroke-dasharray='5 4'/><text x='570' y='230' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>traductorul: pe porțiune dreaptă, la 2/3 din canal (nu lângă ventilator, nu după cot)</text><text x='570' y='246' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>priza de presiune statică perpendiculară pe perete; furtun scurt; cablul de semnal ecranat</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'><text x='450' y='150' text-anchor='middle' font-size='11' font-weight='normal' fill='#2e7d32' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>canal de refulare →</text></g></svg>