<svg xmlns='http://www.w3.org/2000/svg' xmlns:inkscape='http://www.inkscape.org/namespaces/inkscape' xmlns:sodipodi='http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd' width='900' height='560' viewBox='0 0 900 560'><title>Schema monofilară de forță: ventilator acționat cu convertizor de frecvență</title><rect width='900' height='560' fill='#fff'/><g inkscape:groupmode='layer' inkscape:label='Conductoare' id='layer_Conductoare'><path d='M150 30L150 60' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 140L150 170' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 212L150 240' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 282L150 310' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 370L150 400' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 436L150 470' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M140 440L140 500' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='3 3'/><path d='M160 440L160 500' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='3 3'/><path d='M150 512L150 522' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><rect x='40' y='150' width='520' height='300' stroke='#111' stroke-width='1.2' fill='none' stroke-dasharray='5 4'/><text x='60' y='165' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>tablou electric TE-CTA</text></g><g inkscape:groupmode='layer' inkscape:label='Aparate' id='layer_Aparate'><g id='Q1 separator cu siguranțe' inkscape:label='Q1 separator cu siguranțe'><path d='M150 60L150 66' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 66L141 90' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M145 65L155 65' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 96L150 102' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><rect x='145.0' y='108' width='10' height='26' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 102L150 140' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='170' y='80' text-anchor='start' font-size='11' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Q1</text><text x='170' y='96' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>separator blocabil cu lacăt</text><text x='170' y='121' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>F1 gG 25 A (după manualul CF)</text></g><g id='K1 contactor de rețea (opțional)' inkscape:label='K1 contactor de rețea (opțional)'><path d='M150 170L150 176' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 176L141 200' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 206L150 212' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='170' y='190' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>K1 (opțional) AC-1, ≥ curentul de intrare al CF</text><text x='170' y='203' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>numai pentru separare / oprire de urgență, nu pentru start-stop</text></g><g id='L1 bobină de rețea' inkscape:label='L1 bobină de rețea'><path d='M150 240L150 246A5.0 5.0 0 0 1 150 256.0A5.0 5.0 0 0 1 150 266.0A5.0 5.0 0 0 1 150 276.0L150 282' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='170' y='262' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>L1 bobină de rețea (armonici) sau filtru CEM</text></g><g id='U1 convertizor de frecvență' inkscape:label='U1 convertizor de frecvență'><rect x='115.0' y='310' width='70' height='60' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M115.0 370L185.0 310' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='134.5' y='327.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>~</text><text x='165.5' y='353.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>~</text><text x='165.5' y='365.0' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f var.</text><text x='195' y='325' text-anchor='start' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>U1 convertizor 7,5 kW, IP20 în tablou</text><text x='195' y='340' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>curbă U/f pătratică (VT), PID intern</text><text x='195' y='354' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>intrări: 0–10 V, 4–20 mA, DI, PTC, STO</text></g><g id='Z1 filtru de ieșire' inkscape:label='Z1 filtru de ieșire'><rect x='127.0' y='400' width='46' height='30' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='150' y='415.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>du/dt</text><text x='185' y='415' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Z1 filtru du/dt (cablu &gt; 50 m) sau filtru sinus</text><text x='185' y='428' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>(mai multe motoare, motor cu rotor exterior, cablu neecranat)</text></g><g id='Q2 separator de service la ventilator' inkscape:label='Q2 separator de service la ventilator'><path d='M150 470L150 476' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 476L141 500' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M145 475L155 475' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M150 506L150 512' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='170' y='492' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Q2 separator de service lângă ventilator, cu contact</text><text x='170' y='504' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>auxiliar cu deschidere anticipată → oprire CF înainte de separare</text></g><g id='M1 motor ventilator' inkscape:label='M1 motor ventilator'><circle cx='150' cy='540' r='18' stroke='#111' stroke-width='1.6' fill='#fff' stroke-linecap='round' stroke-linejoin='round'/><text x='150' y='536' text-anchor='middle' font-size='13' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>M</text><text x='150' y='549' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~</text><rect x='183' y='534' width='24' height='12' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='195' y='540' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>ϑ</text><path d='M183 546L191 532' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M168 540L183 540' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='534' text-anchor='start' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>M1 7,5 kW, 14,8 A, 1460 min⁻¹, IE3</text><text x='220' y='548' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>cu termistori PTC în bobinaj (bornele T1-T2 → CF)</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'><text x='162' y='36' text-anchor='start' font-size='10' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~ 400 V, 50 Hz, TN-S</text><text x='162' y='50' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>din tabloul de forță al CTA</text><text x='185' y='460' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>cablu de motor ecranat 4G2,5 mm², ecran la 360° la ambele capete</text><text x='185' y='473' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>L ≤ 50 m (după manual); nu în același jgheab cu cablurile de semnal</text><rect x='600' y='40' width='280' height='250' rx='0' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='740' y='58' text-anchor='middle' font-size='11' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Reguli de amplasare</text><text x='612' y='82' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>1. Separator + siguranțe înaintea CF (Q1, F1).</text><text x='612' y='100' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>2. Contactorul K1 este opțional; nu se pornește</text><text x='612' y='112' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>    și nu se oprește motorul din K1.</text><text x='612' y='130' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3. Nimic nu se deschide între CF și motor în</text><text x='612' y='142' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>    mers; Q2 numai cu contact anticipat → stop CF.</text><text x='612' y='160' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>4. Cablu de motor ecranat, ecran la 360°.</text><text x='612' y='178' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>5. Protecția la suprasarcină a motorului o face</text><text x='612' y='190' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>    CF (I²t) + PTC; fără releu termic.</text><text x='612' y='208' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>6. Protecție diferențială, dacă e cerută: tip B.</text><text x='612' y='226' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>7. Filtru de ieșire după lungimea cablului și</text><text x='612' y='238' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>    tipul motorului (manualul CF).</text><text x='612' y='256' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>8. PE la CF, la filtru și la motor; ecranul nu</text><text x='612' y='268' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>    înlocuiește PE.</text></g></svg>