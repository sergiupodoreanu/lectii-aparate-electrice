<svg xmlns='http://www.w3.org/2000/svg' xmlns:inkscape='http://www.inkscape.org/namespaces/inkscape' xmlns:sodipodi='http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd' width='900' height='520' viewBox='0 0 900 520'><title>Ocolirea (bypass) convertizorului cu contactoare interblocate</title><rect width='900' height='520' fill='#fff'/><g inkscape:groupmode='layer' inkscape:label='Conductoare' id='layer_Conductoare'><path d='M200 30L200 60' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 140L200 170' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 170L420 170' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='200' cy='170' r='2.6' fill='#111'/><path d='M200 212L200 240' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 300L200 330' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 372L200 420' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M420 170L420 240' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M420 282L420 310' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M420 348L420 420' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 420L420 420' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='200' cy='420' r='2.6' fill='#111'/><path d='M310 420L310 440' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M160 350L160 262L380 262' stroke='#b3261e' stroke-width='1.2' fill='none' stroke-dasharray='5 4'/></g><g inkscape:groupmode='layer' inkscape:label='Aparate' id='layer_Aparate'><g id='Q1' inkscape:label='Q1'><path d='M200 60L200 66' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 66L191 90' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M195 65L205 65' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 96L200 102' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><rect x='195.0' y='108' width='10' height='26' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 102L200 140' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='80' text-anchor='start' font-size='10' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Q1 + F1</text></g><g id='K1 contactor intrare CF' inkscape:label='K1 contactor intrare CF'><path d='M200 170L200 176' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 176L191 200' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 206L200 212' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='190' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>K1 (AC-1)</text></g><g id='U1 convertizor' inkscape:label='U1 convertizor'><rect x='165.0' y='240' width='70' height='60' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M165.0 300L235.0 240' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='184.5' y='257.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>~</text><text x='215.5' y='283.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>~</text><text x='215.5' y='295.0' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f var.</text><text x='245' y='270' text-anchor='start' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>U1</text></g><g id='K2 contactor ieșire CF' inkscape:label='K2 contactor ieșire CF'><path d='M200 330L200 336' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 336L191 360' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M200 366L200 372' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='350' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>K2 (AC-3) – se închide numai cu CF oprit</text><text x='220' y='362' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>și se deschide numai după stop CF</text></g><g id='K3 contactor bypass' inkscape:label='K3 contactor bypass'><path d='M420 240L420 246' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M420 246L411 270' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M420 276L420 282' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='440' y='260' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>K3 (AC-3) bypass rețea</text></g><g id='F2 releu termic bypass' inkscape:label='F2 releu termic bypass'><path d='M420 310L420 316' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><rect x='413' y='316' width='14' height='26' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M420 316L420 322L424 322L424 336L420 336L420 342' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M420 342L420 348' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='440' y='330' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>F2 releu termic, reglat la I n motor</text><text x='440' y='342' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>(numai în bypass motorul nu e protejat de CF)</text></g><g id='M1 motor ventilator' inkscape:label='M1 motor ventilator'><circle cx='310' cy='458' r='18' stroke='#111' stroke-width='1.6' fill='#fff' stroke-linecap='round' stroke-linejoin='round'/><text x='310' y='454' text-anchor='middle' font-size='13' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>M</text><text x='310' y='467' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~</text><text x='340' y='452' text-anchor='start' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>M1 ventilator</text><text x='340' y='466' text-anchor='start' font-size='8' font-weight='normal' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>pornire directă în bypass: I p = 6…8 × I n</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'><text x='212' y='40' text-anchor='start' font-size='10' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~ 400 V</text><text x='156' y='300' text-anchor='start' font-size='8' font-weight='normal' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central' transform='rotate(-90 156 300)'>interblocare mecanică + electrică K2 ↔ K3</text><rect x='600' y='40' width='290' height='300' rx='0' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='745' y='58' text-anchor='middle' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Secvența de comutare CF → bypass</text><text x='612' y='82' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>1. Stop la CF (rampa de oprire) și așteptarea</text><text x='612' y='94' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>   opririi ventilatorului (poate fi 30…90 s).</text><text x='612' y='112' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>2. Se deschide K2 (ieșirea CF liberă).</text><text x='612' y='130' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3. Temporizare ≥ 1 s (Ziehl-Abegg cere min. 1 s).</text><text x='612' y='148' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>4. Se închide K3: motorul pornește direct, cu</text><text x='612' y='160' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>   I p; F2 protejează motorul.</text><text x='612' y='184' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Invers (bypass → CF): K3 deschis → pauză →</text><text x='612' y='196' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>K2 închis → start CF cu „prindere din mers”</text><text x='612' y='208' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>(flying start), altfel CF dă supracurent.</text><text x='612' y='232' text-anchor='start' font-size='9' font-weight='bold' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Niciodată tensiune de rețea pe ieșirea CF!</text><text x='612' y='256' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Bypassul se folosește la ventilatoare de</text><text x='612' y='268' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>siguranță (desfumare) sau unde oprirea</text><text x='612' y='280' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>nu e admisă (săli de operație, servere).</text><text x='612' y='304' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Manual: comutator 0 – AUTO – 100 % (ex.</text><text x='612' y='316' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Ziehl-Abegg S-D-25) în locul K2/K3.</text></g></svg>