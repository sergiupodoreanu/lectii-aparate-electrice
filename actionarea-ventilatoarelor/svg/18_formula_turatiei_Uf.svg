<svg xmlns='http://www.w3.org/2000/svg' xmlns:inkscape='http://www.inkscape.org/namespaces/inkscape' xmlns:sodipodi='http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd' width='900' height='330' viewBox='0 0 900 330'><title>Turația de sincronism, alunecarea și legea U/f</title><rect width='900' height='330' fill='#fff'/><g inkscape:groupmode='layer' inkscape:label='Conductoare' id='layer_Conductoare'><path d='M520 260L520 50' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M522.6 55.4L520 50L517.4 55.4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M520 260L850 260' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M844.6 262.6L850 260L844.6 257.4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M520.0 260L520.0 264' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='520.0' y='272' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>0</text><path d='M653.3333333333334 260L653.3333333333334 264' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='653.3333333333334' y='272' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>25</text><path d='M786.6666666666667 260L786.6666666666667 264' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='786.6666666666667' y='272' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>50</text><path d='M516 160.0L520 160.0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='504' y='160.0' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>200</text><path d='M516 60.0L520 60.0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='504' y='60.0' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>400</text><path d='M520 260L786.6666666666667 60L840 60' stroke='#1d5fa8' stroke-width='1.6' fill='none' stroke-linecap='round'/><path d='M653.3333333333334 260L653.3333333333334 160.0L520 160.0' stroke='#111' stroke-width='1.2' fill='none' stroke-dasharray='5 4'/></g><g inkscape:groupmode='layer' inkscape:label='Aparate' id='layer_Aparate'><g id='Tabel poli' inkscape:label='Tabel poli'><rect x='40' y='75' width='400' height='108' rx='0' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='110' y='85' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>număr de poli</text><text x='240' y='85' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>n₁ la 50 Hz</text><text x='360' y='85' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>n (turația rotorului)</text><text x='110' y='107' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>2p = 2 (p = 1)</text><text x='110' y='129' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>2p = 4 (p = 2)</text><text x='110' y='151' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>2p = 6 (p = 3)</text><text x='110' y='173' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>2p = 8 (p = 4)</text><text x='240' y='107' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3000 min⁻¹</text><text x='240' y='129' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>1500 min⁻¹</text><text x='240' y='151' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>1000 min⁻¹</text><text x='240' y='173' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>750 min⁻¹</text><text x='360' y='107' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>≈ 2880 min⁻¹ (s = 4 %)</text><text x='360' y='129' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>≈ 1440 min⁻¹ (s = 4 %)</text><text x='360' y='151' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>≈ 960 min⁻¹ (s = 4 %)</text><text x='360' y='173' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>≈ 720 min⁻¹ (s = 4 %)</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'><text x='230' y='30' text-anchor='middle' font-size='13' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Turația de sincronism: n₁ = 60 · f₁ / p</text><text x='230' y='50' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f₁ = frecvența tensiunii de alimentare (Hz), p = numărul de perechi de poli</text><text x='230' y='200' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Alunecarea: s = (n₁ − n) / n₁ ;  n = n₁ · (1 − s) ;  s = 2…5 % la sarcina nominală</text><text x='230' y='222' text-anchor='middle' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Motor cu 2p = 4, alimentat din convertizor:</text><text x='230' y='242' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f₁ = 50 Hz → n₁ = 1 500 min⁻¹   ·   f₁ = 25 Hz → 750 min⁻¹   ·   f₁ = 10 Hz → 300 min⁻¹</text><text x='230' y='262' text-anchor='middle' font-size='10' font-weight='bold' fill='#2e7d32' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Turația rotorului se reglează prin frecvența statorică f₁.</text><text x='680.0' y='280' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f₁ (Hz)</text><text x='490' y='46' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>U₁ (V)</text><text x='680.0' y='36' text-anchor='middle' font-size='11' font-weight='bold' fill='#1d5fa8' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>U₁ / f₁ = constant (Φ = constant)</text><text x='550' y='90' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>400 V / 50 Hz = 8 V/Hz</text><text x='550' y='102' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>25 Hz → 200 V; 10 Hz → 80 V</text><text x='659.3333333333334' y='150.0' text-anchor='start' font-size='8' font-weight='normal' fill='#1d5fa8' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>200 V</text><text x='746.6666666666667' y='50' text-anchor='start' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f₁ &gt; 50 Hz: U₁ = U₁N (slăbire de câmp)</text><text x='680' y='300' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Fluxul magnetic Φ ≈ U₁ / (4,44 · f₁ · w₁ · kw₁). Dacă f₁ scade și U₁ rămâne constantă,</text><text x='680' y='312' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Φ crește → saturația circuitului magnetic, curent de magnetizare mare, încălzire.</text></g></svg>