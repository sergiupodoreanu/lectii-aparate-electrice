<rect x='290.0' y='20.0' width='320' height='40' rx='4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='450' y='40.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Pasul 1: ce ventilator și ce motor am?</text></g><g id='A. Ventilator mic 1~ 230 V' inkscape:label='A. Ventilator mic 1~ 230 V'><rect x='20.0' y='103.0' width='260' height='64' rx='4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='150' y='122.0' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>A. Ventilator mic 1~ 230 V</text><text x='150' y='135.0' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>motor cu rotor exterior,</text><text x='150' y='148.0' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>„comandabil în tensiune”</text></g><g id='B. Motor asincron 3~ standard' inkscape:label='B. Motor asincron 3~ standard'><rect x='320.0' y='103.0' width='260' height='64' rx='4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='450' y='122.0' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>B. Motor asincron 3~ standard</text><text x='450' y='135.0' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>(IEC, orice putere), sau</text><text x='450' y='148.0' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>ventilator vechi de refăcut</text></g><g id='C. Instalație nouă /' inkscape:label='C. Instalație nouă /'><rect x='620.0' y='103.0' width='260' height='64' rx='4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='750' y='122.0' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>C. Instalație nouă /</text><text x='750' y='135.0' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>înlocuire completă</text><text x='750' y='148.0' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>(CTA, condensator, grajd nou)</text></g><g id='Reglare prin tensiune' inkscape:label='Reglare prin tensiune'><rect x='20.0' y='207.0' width='260' height='76' rx='4' stroke='#1d5fa8' stroke-width='1.6' fill='none' stroke-linecap='round'/><text x='150' y='225.5' text-anchor='middle' font-size='8' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Reglare prin tensiune</text><text x='150' y='238.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>transformator în trepte (ieftin, trepte)</text><text x='150' y='251.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>sau regulator cu triac (zgomot, +10–20 %</text><text x='150' y='264.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>consum) sau CF cu filtru sinus (FTET)</text></g><g id='Convertizor de frecvență' inkscape:label='Convertizor de frecvență'><rect x='320.0' y='207.0' width='260' height='76' rx='4' stroke='#1d5fa8' stroke-width='1.6' fill='none' stroke-linecap='round'/><text x='450' y='225.5' text-anchor='middle' font-size='8' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Convertizor de frecvență</text><text x='450' y='238.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>un motor: CF universal / HVAC + cablu</text><text x='450' y='251.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>ecranat; mai multe motoare sau rotor</text><text x='450' y='264.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>exterior: CF cu filtru sinus</text></g><g id='Ventilator EC' inkscape:label='Ventilator EC'><rect x='620.0' y='207.0' width='260' height='76' rx='4' stroke='#1d5fa8' stroke-width='1.6' fill='none' stroke-linecap='round'/><text x='750' y='225.5' text-anchor='middle' font-size='8' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Ventilator EC</text><text x='750' y='238.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>convertizor și motor într-un produs;</text><text x='750' y='251.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>comandă 0–10 V / Modbus; randament</text><text x='750' y='264.5' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>maxim, fără cablu ecranat</text></g><g id='Pasul 2: mărimea — după curentul de pe plăcuța motorului (nu după kW): I convertizor ≥ I n motor,' inkscape:label='Pasul 2: mărimea — după curentul de pe plăcuța motorului (nu după kW): I convertizor ≥ I n motor,'><rect x='100.0' y='325.0' width='700' height='50' rx='4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='450' y='343.5' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Pasul 2: mărimea — după curentul de pe plăcuța motorului (nu după kW): I convertizor ≥ I n motor,</text><text x='450' y='356.5' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>regim de suprasarcină „normală” 110 %; la mai multe motoare pe un convertizor: I ≥ suma curenților</text></g><g id='Pasul 3: unde stă — IP20 în tablou (cablu ecranat până la motor) sau IP54/IP55 lângă ventilator;' inkscape:label='Pasul 3: unde stă — IP20 în tablou (cablu ecranat până la motor) sau IP54/IP55 lângă ventilator;'><rect x='100.0' y='403.0' width='700' height='44' rx='4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='450' y='418.5' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Pasul 3: unde stă — IP20 în tablou (cablu ecranat până la motor) sau IP54/IP55 lângă ventilator;</text><text x='450' y='431.5' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>în grajd: în anticameră, nu în adăpost (amoniac, praf, umezeală)</text></g><g id='Pasul 4: ce mai trebuie — filtru CEM C1/C2 în clădiri, siguranțe după manual, DDR tip B dacă e cerut, PTC/TB,' inkscape:label='Pasul 4: ce mai trebuie — filtru CEM C1/C2 în clădiri, siguranțe după manual, DDR tip B dacă e cerut, PTC/TB,'><rect x='100.0' y='476.0' width='700' height='44' rx='4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='450' y='491.5' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Pasul 4: ce mai trebuie — filtru CEM C1/C2 în clădiri, siguranțe după manual, DDR tip B dacă e cerut, PTC/TB,</text><text x='450' y='504.5' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>separator de service cu contact anticipat, ocolire manuală 0–AUTO–100 % la ventilatoarele vitale, alarmă</text></g><g id='Pasul 5: parametrii — date de plăcuță, curbă U/f pătratică, f min 15–20 Hz, rampe lungi, prindere din mers, frecvențe de evitare' inkscape:label='Pasul 5: parametrii — date de plăcuță, curbă U/f pătratică, f min 15–20 Hz, rampe lungi, prindere din mers, frecvențe de evitare'><rect x='100.0' y='547.0' width='700' height='36' rx='4' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='450' y='565.0' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Pasul 5: parametrii — date de plăcuță, curbă U/f pătratică, f min 15–20 Hz, rampe lungi, prindere din mers, frecvențe de evitare</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'></g></svg>