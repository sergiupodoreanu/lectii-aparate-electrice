<svg xmlns='http://www.w3.org/2000/svg' xmlns:inkscape='http://www.inkscape.org/namespaces/inkscape' xmlns:sodipodi='http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd' width='900' height='300' viewBox='0 0 900 300'><title>Modul incendiu la ventilatoarele de desfumare</title><rect width='900' height='300' fill='#fff'/><g inkscape:groupmode='layer' inkscape:label='Conductoare' id='layer_Conductoare'><path d='M180 100L246 100' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M274 100L410 100' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M410 100L410 90' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M410 90L450 90' stroke='#1d5fa8' stroke-width='1.6' fill='none' stroke-linecap='round'/><path d='M490 130L490 160' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M490 160L660 160' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M660 160L660 115' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></g><g inkscape:groupmode='layer' inkscape:label='Aparate' id='layer_Aparate'><g id='CDI centrală de detecție incendiu' inkscape:label='CDI centrală de detecție incendiu'><rect x='40' y='60' width='140' height='80' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='110' y='82' text-anchor='middle' font-size='10' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>centrală de</text><text x='110' y='96' text-anchor='middle' font-size='10' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>detecție incendiu</text><text x='110' y='116' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>ieșire releu</text></g><g id='K-CDI contact NC' inkscape:label='K-CDI contact NC'><path d='M246 100L256 100' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M256 100L266 91' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M264 100L274 100' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M264 91L264 100' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='260' y='84' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>contact NC</text><text x='260' y='118' text-anchor='middle' font-size='8' font-weight='normal' fill='#b3261e' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>se deschide la alarmă</text></g><g id='U1 convertizor ventilator desfumare' inkscape:label='U1 convertizor ventilator desfumare'><rect x='410.0' y='60' width='80' height='70' rx='0' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M410.0 130L490.0 60' stroke='#111' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='432.0' y='79.5' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>~</text><text x='468.0' y='110.5' text-anchor='middle' font-size='14' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>~</text><text x='468.0' y='122.5' text-anchor='middle' font-size='7' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>f var.</text><text x='490' y='40' text-anchor='middle' font-size='9' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>U1 – DI „mod incendiu”</text></g><g id='M1 ventilator desfumare' inkscape:label='M1 ventilator desfumare'><circle cx='660' cy='95' r='20' stroke='#111' stroke-width='1.6' fill='#fff' stroke-linecap='round' stroke-linejoin='round'/><text x='660' y='91' text-anchor='middle' font-size='13' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>M</text><text x='660' y='104' text-anchor='middle' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~</text><circle cx='720' cy='95' r='16' stroke='#111' stroke-width='1.6' fill='#fff' stroke-linecap='round' stroke-linejoin='round'/><path d='M720 95Q705.6 80.6 712.0 94.2Q716.8 99.8 720 95Z' stroke='#111' stroke-width='1.6' fill='#111' stroke-linecap='round' stroke-linejoin='round'/><path d='M720 95Q734.4 109.4 728.0 95.8Q723.2 90.2 720 95Z' stroke='#111' stroke-width='1.6' fill='#111' stroke-linecap='round' stroke-linejoin='round'/><path d='M680 95L704 95' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='690' y='130' text-anchor='middle' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>ventilator de desfumare F400 (400 °C / 2 h)</text></g></g><g inkscape:groupmode='layer' inkscape:label='Text' id='layer_Text'><text x='180' y='90' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>24 V</text><text x='600' y='152' text-anchor='start' font-size='8' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>3~ U var.</text><rect x='40' y='180' width='850' height='105' rx='0' stroke='#111' stroke-width='1.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/><text x='465' y='198' text-anchor='middle' font-size='10' font-weight='bold' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>Ce face „modul incendiu” (fire mode / Feuerbetrieb)</text><text x='52' y='218' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>• CF trece pe referința de incendiu (de obicei 50 Hz sau f max.) și ignoră toate celelalte comenzi, inclusiv oprirea din BMS.</text><text x='52' y='234' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>• Se dezactivează avertizările și limitările neesențiale: supratemperatura CF, managementul termic, limitarea de curent — CF merge „până cade”.</text><text x='52' y='250' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>• Se folosește contact NC (deschis = incendiu): un fir rupt de foc pune singur ventilatorul la turație maximă. Protecția PTC nu mai oprește motorul.</text><text x='52' y='266' text-anchor='start' font-size='9' font-weight='normal' fill='#111' font-family='DejaVu Sans, Arial, sans-serif' dominant-baseline='central'>• Bypassul cu contactor (schema 10) rămâne soluția impusă de multe proiecte de desfumare: la avaria CF, motorul pornește direct din rețea.</text></g></svg>