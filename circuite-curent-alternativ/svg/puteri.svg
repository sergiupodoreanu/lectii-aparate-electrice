<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" role="img" aria-label="Triunghiul puterilor și analogia cu halba de bere" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#222" stroke-linecap="round" stroke-linejoin="round"><title>Triunghiul puterilor și analogia cu halba de bere</title><line x1="90.0" y1="210.0" x2="207.7" y2="210.0" stroke="#2e8b57" stroke-width="3" fill="none"/><polygon points="207.7,210.0 199.6,213.9 199.6,206.1" fill="#2e8b57" stroke="none"/><text x="148.9" y="230.0" text-anchor="middle" font-size="12" fill="#2e8b57" font-weight="bold" stroke="none" >P = 841 W (putere activă)</text><line x1="207.7" y1="210.0" x2="207.7" y2="86.7" stroke="#d97706" stroke-width="3" fill="none"/><polygon points="207.7,86.7 211.7,94.8 203.8,94.8" fill="#d97706" stroke="none"/><text x="217.7" y="148.3" text-anchor="start" font-size="12" fill="#d97706" font-weight="bold" stroke="none" >Q = 881 var</text><text x="217.7" y="163.3" text-anchor="start" font-size="11" fill="#222" font-weight="normal" stroke="none" >(putere reactivă)</text><line x1="90.0" y1="210.0" x2="207.7" y2="86.7" stroke="#7c3aed" stroke-width="3.5" fill="none"/><polygon points="207.7,86.7 204.7,96.2 198.4,90.2" fill="#7c3aed" stroke="none"/><text x="118.9" y="138.3" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="bold" stroke="none" >S = 1219 VA</text><text x="86.9" y="153.3" text-anchor="middle" font-size="11" fill="#222" font-weight="normal" stroke="none" >(putere aparentă)</text><path d="M124.0,210.0 A34,34 0 0 0 113.6,185.5" fill="none" stroke="#222" stroke-width="1.5"/><text x="136.0" y="194.5" text-anchor="middle" font-size="13" fill="#222" font-weight="normal" stroke="none" >φ = 46°</text><text x="180.0" y="40.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold" stroke="none" >S² = P² + Q²</text><text x="180.0" y="60.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal" stroke="none" >cos φ = P / S = 0,69</text><path d="M470,60 L478,230 L582,230 L590,60 Z" fill="none" stroke="#222" stroke-width="2.5"/><path d="M590,100 a28,30 0 0 1 0,80" fill="none" stroke="#222" stroke-width="2.5"/><path d="M473,120 L478,228 L582,228 L587,120 Z" fill="#2e8b57" opacity="0.55"/><path d="M471,70 L473,120 L587,120 L589,70 Z" fill="#d97706" opacity="0.45"/><text x="530.0" y="180.0" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold" stroke="none" >P</text><text x="530.0" y="102.0" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold" stroke="none" >Q</text><text x="530.0" y="255.0" text-anchor="middle" font-size="11" fill="#222" font-weight="normal" stroke="none" >halba = S (paharul trebuie</text><text x="530.0" y="268.0" text-anchor="middle" font-size="11" fill="#222" font-weight="normal" stroke="none" >să încapă bere + spumă)</text><text x="450.0" y="180.0" text-anchor="end" font-size="11" fill="#2e8b57" font-weight="normal" stroke="none" >berea = P (ce folosești)</text><text x="450.0" y="100.0" text-anchor="end" font-size="11" fill="#d97706" font-weight="normal" stroke="none" >spuma = Q (ocupă loc,</text><text x="450.0" y="113.0" text-anchor="end" font-size="11" fill="#d97706" font-weight="normal" stroke="none" >dar nu te satură)</text></svg>